{% extends "base.html" %}
{% block title %}Login | B Team Quiz{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="card login-card">
    <div class="logo">🧬</div>
    <h1>B Team Quiz</h1>
    <p class="muted">Biology & Life Science Daily Practice</p>
    <form method="post">
      <label>User ID</label>
      <input name="user_id" required autocomplete="username" placeholder="Enter User ID">
      <label>Password</label>
      <input type="password" name="password" required autocomplete="current-password" placeholder="Enter password">
      <button class="btn primary full" type="submit">Login</button>
    </form>
    <p class="small">One account • One attempt per day • 30 questions</p>
  </div>
</div>
{% endblock %}
